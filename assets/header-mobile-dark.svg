<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Aniket Singh — @acephos</title>
  <desc id="desc">The one who seeks shall always outdo the one who does not. A dark slate gradient with fine orbital lines and small points of light.</desc>
  <defs>
    <linearGradient id="slate" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#171c23"/>
      <stop offset="0.55" stop-color="#2b333e"/>
      <stop offset="1" stop-color="#46515f"/>
    </linearGradient>
    <radialGradient id="light" cx="0.82" cy="0.15" r="0.75">
      <stop stop-color="#cbd5e1" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#cbd5e1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#94a3b8" stop-opacity="0.12"/>
      <stop offset="0.6" stop-color="#cbd5e1" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#94a3b8" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="frame"><rect width="720" height="440" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="720" height="440" fill="url(#slate)"/>
    <rect width="720" height="440" fill="url(#light)"/>
    <g transform="translate(642 106)" opacity="0.36" fill="none">
      <circle r="126" stroke="#cbd5e1" stroke-opacity="0.18"/>
      <circle r="104" stroke="#cbd5e1" stroke-opacity="0.08" stroke-dasharray="2 9"/>
      <ellipse rx="166" ry="56.7" transform="rotate(-34)" stroke="url(#orbit)" stroke-width="1.2"/>
      <ellipse rx="166" ry="56.7" transform="rotate(34)" stroke="#cbd5e1" stroke-opacity="0.16"/>
      <path d="M-12 0h24M0-12v24" stroke="#cbd5e1" stroke-opacity="0.5"/>
      <circle cx="-103.32" cy="-71.82" r="3.5" fill="#e2e8f0"/>
      <circle cx="103.32" cy="71.82" r="2.5" fill="#cbd5e1"/>
      <circle cx="135" cy="-81.9" r="2" fill="#cbd5e1" fill-opacity="0.6"/>
    </g>
    <text x="44" y="133" fill="#f1f5f9" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="62" font-weight="600" letter-spacing="-2">Aniket Singh</text>
    <text x="46" y="177" fill="#aeb9c7" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23">@acephos</text>
    <path d="M46 238h36" stroke="#aeb9c7" stroke-opacity="0.55"/>
    <text x="44" y="280" fill="#d8dee7" font-family="Georgia,Times New Roman,serif" font-size="32" font-style="italic">
      <tspan x="44" dy="0">The one who seeks shall always</tspan>
      <tspan x="44" dy="42">outdo the one who does not.</tspan>
    </text>
  </g>
</svg>
