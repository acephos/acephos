<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Aniket Singh</title>
  <desc id="desc">Aniket Singh, @acephos. White text on a dark slate gray gradient.</desc>
  <defs>
    <linearGradient id="slate" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#171c23"/>
      <stop offset="0.5" stop-color="#282f39"/>
      <stop offset="1" stop-color="#46515f"/>
    </linearGradient>
    <radialGradient id="light" cx="0.8" cy="0" r="0.9">
      <stop stop-color="#cbd5e1" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#cbd5e1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="720" height="300" rx="16" fill="url(#slate)"/>
  <rect width="720" height="300" rx="16" fill="url(#light)"/>
  <text x="48" y="151" fill="#f1f5f9" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="64" font-weight="600" letter-spacing="-2">Aniket Singh</text>
  <text x="50" y="203" fill="#b8c1cc" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="27" font-weight="400">@acephos</text>
</svg>
